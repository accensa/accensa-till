# A8 / A9: the checks AGENTS.md calls the definition of done. Each step is a
# root script, so CI and a local run mean the same thing.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: till
          POSTGRES_PASSWORD: till
          POSTGRES_DB: till
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U till -d till"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://till:till@localhost:5432/till
      SESSION_SECRET: ci-only-session-secret-please-ignore-0000000000
      GATEWAY_PUBLIC_URL: http://localhost:3000
      PAYOUT_PROVIDER: mock
      NEAR_NETWORK: near:testnet
    steps:
      # fetch-depth: 0 so scripts/check-roadmap.sh can diff against
      # origin/$GITHUB_BASE_REF; the default shallow checkout has no base ref.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No `version:` input: action-setup v4 fails with "Multiple versions of pnpm
      # specified" when both it and package.json `packageManager` set a version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: migrate
        run: pnpm db:migrate

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test

      - name: boundaries
        run: pnpm boundaries

      - name: roadmap
        run: pnpm roadmap:check

  # DQ-1, G1: the PRD section 8 walk, asserted, on a database that has only just
  # been migrated. Kept a separate job so a failing unit test does not hide a broken
  # demo, and because the demo is the thing a judge actually runs.
  #
  # It runs twice. The second pass is the rerun check `scripts/demo.ts` cannot make
  # about itself: on a database that already holds a finished walk, every "exactly
  # one row is this run's" assertion is a real test of the run ids, and a payment
  # whose signed delegate happens to repeat an earlier run's is refused `409` as the
  # replay it is. One pass on a fresh database would ship that bug green.
  #
  # No funded key anywhere: the chain, the payout provider and the loopback upstream
  # are the three surfaces `scripts/demo.ts` marks SIMULATED in its own output. It
  # never runs on a schedule, because AGENTS.md forbids sending a mainnet transaction
  # from automation.
  demo:
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: till
          POSTGRES_PASSWORD: till
          POSTGRES_DB: till
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U till -d till"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://till:till@localhost:5432/till
      SESSION_SECRET: ci-only-session-secret-please-ignore-0000000000
      GATEWAY_PUBLIC_URL: http://localhost:3000
      PAYOUT_PROVIDER: mock
      NEAR_NETWORK: near:testnet
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm seed
      # Must exit non-zero on any failed assertion (DQ-1). Mock payouts only:
      # CI never holds a funded key.
      - run: pnpm demo
      - name: demo (again, against the database the first pass just wrote)
        run: pnpm demo
