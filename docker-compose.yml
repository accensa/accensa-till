# DQ-1: a fresh clone runs `docker compose up` with no keys. The values below are
# development-only defaults, chosen to be useless anywhere else. Nothing here reads
# a .env file — `apps/api/src/env.ts` reads process.env, and AGENTS.md "Money and
# secrets safety" forbids creating one — so these are the whole configuration, and
# `compose up` is the only way this file ships any of it.
name: till

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: till
      POSTGRES_PASSWORD: till
      POSTGRES_DB: till
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U till -d till"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # A16: no volumes. Mounting the repository and running `pnpm install` inside
    # the mount left root-owned dependency directories and a 650 MB store in
    # whoever's checkout it was; the image carries them instead.
    command: sh -c "pnpm db:migrate && pnpm --filter @till/api dev"
    environment:
      DATABASE_URL: postgres://till:till@postgres:5432/till
      # A3 note: these two defaults must satisfy apps/api/src/env.ts, which
      # rejects a SESSION_SECRET shorter than 32 characters.
      SESSION_SECRET: dev-only-session-secret-change-me-0000000000
      GATEWAY_PUBLIC_URL: http://localhost:3000
      PAYOUT_PROVIDER: mock
      NEAR_NETWORK: near:testnet
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter @till/web dev
    environment:
      API_ORIGIN: http://api:3000
    # 3001 in the container too: apps/web's dev script pins that port so `pnpm
    # dev` on a single host does not collide with the api on 3000.
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  # Only the database outlives a `docker compose down`.
  pgdata:
